name: Bug 报告
description: 报告可以稳定复现的错误或 iThoughts 文件兼容问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传包含个人信息、案件材料或商业秘密的原始导图。
  - type: input
    id: version
    attributes:
      label: iThread 版本
      placeholder: 例如 v0.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - iThoughts .itmz 导入
        - 编辑与快捷键
        - 布局与性能
        - 保存或导出
        - 启动或界面
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      placeholder: 请按顺序列出操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏或脱敏样本
      description: 仅上传你有权公开且已经脱敏的文件。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认公开内容不含个人信息、工作秘密或其他敏感资料。
          required: true
