name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # rebuild-book / stats commit their artifacts with GITHUB_TOKEN, and GitHub does NOT raise a push
  # event for GITHUB_TOKEN pushes — so without this, regenerated EPUB/PDF + stats never reach the
  # live site until the next human push. Re-run Deploy when those workflows finish so prod catches up.
  workflow_run:
    workflows: ["Rebuild book artifacts", "Stats"]
    types: [completed]
    branches: [main]

# Let GITHUB_TOKEN publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  # A failed/cancelled upstream run has no deployable output. Its skipped workflow must not
  # replace a valid pending Pages run (GitHub permits only one pending run in a group).
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('pages-skipped-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    # On a workflow_run trigger, only deploy if the rebuild/stats run actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Always deploy main's tip. A workflow_run trigger hands us the *triggering* commit, which
      # predates the bot's artifact commit, so pin the ref to main to publish the freshest binaries.
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only deploy green code: run the full gate (it also produces dist/).
      - run: pnpm gate

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
