name: Build Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Run quality gate
        run: pnpm gate

      - name: Build unsigned Windows portable executable
        run: pnpm desktop:dist

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/windows/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/windows/SHA256SUMS.txt

      - name: Upload unsigned artifact for signing
        uses: actions/upload-artifact@v4
        with:
          name: iThread-windows-x64-unsigned
          path: |
            release/windows/*.exe
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          $assets = @(Get-ChildItem release/windows/*.exe | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release/windows/SHA256SUMS.txt).Path
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME
          )
          $arguments += $assets
          $arguments += @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "iThread $env:GITHUB_REF_NAME",
            "--prerelease",
            "--verify-tag"
          )
          if (Test-Path $notes) {
            $arguments += @("--notes-file", $notes)
          } else {
            $arguments += "--generate-notes"
          }
          gh @arguments
