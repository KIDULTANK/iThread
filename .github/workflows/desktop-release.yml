name: Build Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Run quality gate
        run: pnpm gate

      - name: Build unsigned Windows portable executable
        run: pnpm desktop:dist

      - name: Upload unsigned artifact for signing
        uses: actions/upload-artifact@v4
        with:
          name: iThread-windows-x64-unsigned
          path: release/windows/*.exe
          if-no-files-found: error
          retention-days: 14
