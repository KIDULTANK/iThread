name: Build Android tablet preview

on:
  workflow_dispatch:
  push:
    branches: [codex/android-tablet]
    paths:
      - "android/**"
      - "src/**"
      - "test/**"
      - "scripts/android-prepare.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: pnpm install --frozen-lockfile
      - name: Check shared editor
        run: pnpm typecheck && pnpm exec vitest run test/android-bridge.test.ts test/android-export.test.ts test/use-touch-context-menu.test.tsx test/sync-connection.test.ts test/use-disk-file.test.tsx test/pwaUpdate.test.ts test/toolbar.test.tsx test/app-integration.test.tsx --maxWorkers=2 --minWorkers=1
      - name: Bundle offline editor
        run: pnpm android:prepare
      - name: Compile APK and run native policy tests
        run: gradle -p android testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Checksums
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iThread-Android-tablet-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: iThread-Android-instrumented-tests
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      # Build both APKs on the same runner with the same temporary debug keystore.
      # This verifies upgrade persistence, not stable production signing across runs.
      - uses: actions/checkout@v4
        with:
          ref: 0afc12f9eefd7fcb303d5efc13dd727c1036c43f
          path: upgrade-baseline
      - name: Build previous preview for install-over upgrade checks
        working-directory: upgrade-baseline
        run: |
          pnpm install --frozen-lockfile
          pnpm android:prepare
          gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iThread-Android-upgrade-baseline
          path: upgrade-baseline/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: iThread-Android-instrumented-tests
          path: test-apks
      - uses: actions/download-artifact@v4
        with:
          name: iThread-Android-upgrade-baseline
          path: baseline-apk
      - name: Enable emulator acceleration on this disposable runner
        run: sudo chmod a+rw /dev/kvm
      - name: Run tablet runtime checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            if [ '${{ matrix.api }}' -ge 35 ]; then adb install -r baseline-apk/app-debug.apk; else adb install -r test-apks/debug/app-debug.apk; fi
            adb install -r test-apks/androidTest/debug/app-debug-androidTest.apk
            if [ '${{ matrix.api }}' -ge 35 ]; then adb shell am instrument -w -r -e class com.ithread.android.UpgradeStorageTest#seedBaselineData com.ithread.android.preview.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-seed.log; fi
            adb logcat -d -v brief AndroidRuntime:E chromium:E '*:S' > runtime-errors.log
            if [ '${{ matrix.api }}' -ge 35 ]; then ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=|INSTRUMENTATION_STATUS_CODE: -4' upgrade-seed.log && grep -q 'OK (1 test)' upgrade-seed.log; fi
            adb install -r test-apks/debug/app-debug.apk
            if [ '${{ matrix.api }}' -ge 35 ]; then adb shell am instrument -w -r -e class com.ithread.android.UpgradeStorageTest#verifyAfterUpgrade com.ithread.android.preview.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-verify.log; fi
            adb logcat -d -v brief AndroidRuntime:E chromium:E '*:S' > runtime-errors.log
            if [ '${{ matrix.api }}' -ge 35 ]; then ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=|INSTRUMENTATION_STATUS_CODE: -4' upgrade-verify.log && grep -q 'OK (1 test)' upgrade-verify.log; fi
            adb shell am instrument -w -r -e notClass com.ithread.android.UpgradeStorageTest com.ithread.android.preview.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.log
            adb logcat -d -v brief AndroidRuntime:E chromium:E '*:S' > runtime-errors.log
            ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=' instrumentation.log
            grep -q 'OK (' instrumentation.log
            if [ '${{ matrix.api }}' -ge 35 ]; then ! grep -q 'INSTRUMENTATION_STATUS_CODE: -4' instrumentation.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-api-${{ matrix.api }}
          path: |
            instrumentation.log
            upgrade-*.log
            runtime-errors.log
          if-no-files-found: warn
          retention-days: 14
