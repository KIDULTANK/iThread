plugins { id 'com.android.application' }

def signingEnvironment = [
    'ITHREAD_ANDROID_KEYSTORE', 'ITHREAD_ANDROID_STORE_PASSWORD',
    'ITHREAD_ANDROID_KEY_ALIAS', 'ITHREAD_ANDROID_KEY_PASSWORD'
].collectEntries { name -> [(name): System.getenv(name)] }
def signingReady = signingEnvironment.values().every { it != null && !it.isEmpty() }

android {
    namespace 'com.ithread.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ithread.android'
        minSdk 29
        targetSdk 36
        versionCode 70004
        versionName '0.7.0-android-dev.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'HUAWEI_COMPAT', 'false'
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
        huaweiCompat {
            initWith debug
            applicationIdSuffix '.huawei.compat'
            versionNameSuffix '-huawei-compat.1'
            buildConfigField 'boolean', 'HUAWEI_COMPAT', 'true'
            matchingFallbacks = ['debug']
        }
    }
    if (project.hasProperty('ithreadHuaweiCompat')) testBuildType 'huaweiCompat'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/ithread/assets')
        main.res.srcDir layout.buildDirectory.dir('generated/ithread/res')
    }
    buildFeatures { buildConfig true }
}

if (signingReady) {
    android.signingConfigs.create('publicBeta') {
        storeFile rootProject.file(signingEnvironment.ITHREAD_ANDROID_KEYSTORE)
        storePassword signingEnvironment.ITHREAD_ANDROID_STORE_PASSWORD
        keyAlias signingEnvironment.ITHREAD_ANDROID_KEY_ALIAS
        keyPassword signingEnvironment.ITHREAD_ANDROID_KEY_PASSWORD
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.publicBeta
}
// A release must never silently fall back to an unsigned APK or a disposable debug certificate.
gradle.taskGraph.whenReady { graph ->
    if (!signingReady && graph.allTasks.any { task ->
        task.project == project && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']
    }) throw new GradleException('Release requires the four ITHREAD_ANDROID_* signing environment variables. Keep a backed-up key outside Git.')
}

tasks.register('verifyWebAssets') {
    doLast {
        if (!layout.buildDirectory.file('generated/ithread/assets/web/index.html').get().asFile.exists())
            throw new GradleException('Run pnpm android:prepare from the repository root first.')
        def profile = layout.buildDirectory.file('generated/ithread/build-profile.txt').get().asFile
        def expected = project.hasProperty('ithreadHuaweiCompat') ? 'huawei' : 'standard'
        if (!profile.exists() || profile.text.trim() != expected)
            throw new GradleException('Web asset profile must match the requested native build profile.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
