plugins { id 'com.android.application' }

android {
    namespace 'com.ithread.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ithread.android'
        minSdk 29
        targetSdk 36
        versionCode 70001
        versionName '0.7.0-android-dev.1'
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/ithread/assets')
        main.res.srcDir layout.buildDirectory.dir('generated/ithread/res')
    }
    buildFeatures { buildConfig true }
}

tasks.register('verifyWebAssets') {
    doLast {
        if (!layout.buildDirectory.file('generated/ithread/assets/web/index.html').get().asFile.exists())
            throw new GradleException('Run pnpm android:prepare from the repository root first.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
